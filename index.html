
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008F83">
  <title>Meus Apps</title>

  <style>
    :root {
      color-scheme: light;
      --primary: #008F83;
      --primary-dark: #006E65;
      --background: #F3F7F7;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--background);
      font-family: system-ui, -apple-system,
                   "Segoe UI", Roboto, sans-serif;
    }

    .btn-apps {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      width: min(100%, 320px);
      min-height: 64px;
      padding: 16px 24px;

      border: 0;
      border-radius: 18px;
      background: var(--primary);
      color: #FFFFFF;

      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;

      box-shadow: 0 8px 24px rgba(0, 143, 131, .22);
      transition: transform .2s ease,
                  background .2s ease,
                  box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-apps svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .btn-apps:hover {
        background: var(--primary-dark);
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(0, 143, 131, .28);
      }
    }

    .btn-apps:active {
      transform: scale(.97);
    }

    .btn-apps:focus-visible {
      outline: 3px solid #FFCA63;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-apps {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <a
    class="btn-apps"
    href="https://meusapps-mth.netlify.app/"
    aria-label="Abrir Meus Apps"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>

    <span>Meus Apps</span>
  </a>

</body>
</html>
