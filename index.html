<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#6d4cce">
    <title>Meus Apps — Vitrine de aplicativos</title>
    <style>
        *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f7f4ff;color:#1b2938}header{background:#6d4cce;color:white;padding:calc(26px + env(safe-area-inset-top)) 22px 30px;border-radius:0 0 28px 28px}.wrap{max-width:780px;margin:auto}h1{margin:0;font-size:29px}header p{margin:8px 0 0;opacity:.9}main{padding:22px 16px 35px}.intro{font-weight:750;margin:0 0 16px;font-size:19px}.apps{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.app{background:white;border:1px solid #e5e9ef;border-radius:20px;padding:18px;box-shadow:0 5px 18px #2030400c;display:flex;align-items:center;gap:14px;flex-direction:column;text-align:center;}.icon{width:54px;height:54px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;font-size:27px;background:#e5f1ff}.details{flex:1;min-width:0}.name{font-size:17px;font-weight:750;margin:0 0 5px}.desc{font-size:13px;color:#657182;margin:0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:14px;font-weight:750;cursor:pointer;background:#6d4cce;color:white;min-height:44px}button:disabled{background:#e8ebef;color:#7a8591;cursor:not-allowed}button:focus-visible{outline:3px solid #f2b84b;outline-offset:3px}.status{margin-top:16px;min-height:24px;font-size:14px;color:#334155}.status a{color:#6d4cce;font-weight:700}footer{text-align:center;padding:10px 16px 30px;color:#7a8591;font-size:12px}@media(max-width:380px){.app{flex-wrap:wrap}.app button{width:100%}}.app button{width:100%}.app{padding:18px 10px}.details{width:100%}.icon{width:66px;height:66px;font-size:32px}.desc{min-height:34px}@media(min-width:600px){.apps{grid-template-columns:repeat(4,minmax(0,1fr))}}
    </style>
</head>

<body>
    <header>
        <div class="wrap">
            <h1>Meus Apps</h1>
            <p>Seus aplicativos em um só lugar.</p>
        </div>
    </header>
    <main class="wrap">
        <p class="intro">Aplicativos disponíveis</p>
        <section class="apps" aria-label="Catálogo de aplicativos">
            <article class="app">
                <div class="icon" aria-hidden="true">📅</div>
                <div class="details">
                    <h2 class="name">Folgas107</h2>
                    <p class="desc">Organize e consulte suas folgas.</p>
                </div>
                <button type="button" id="download">Baixar APK</button>
            </article>
            <article class="app">
                <div class="icon" aria-hidden="true">📁</div>
                <div class="details">
                    <h2 class="name">Aplicativo 2</h2>
                    <p class="desc">Novidade em preparação.</p>
                </div>
                <button type="button" disabled aria-label="Aplicativo 2 em breve">Em breve</button>
            </article>
            <article class="app">
                <div class="icon" aria-hidden="true">🛠️</div>
                <div class="details">
                    <h2 class="name">Aplicativo 3</h2>
                    <p class="desc">Novidade em preparação.</p>
                </div>
                <button type="button" disabled aria-label="Aplicativo 3 em breve">Em breve</button>
            </article>
            <article class="app">
                <div class="icon" aria-hidden="true">📱</div>
                <div class="details">
                    <h2 class="name">Aplicativo 4</h2>
                    <p class="desc">Novidade em preparação.</p>
                </div>
                <button type="button" disabled aria-label="Aplicativo 4 em breve">Em breve</button>
            </article>
        </section>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <footer>Meus Apps • Novidades em breve</footer>
    <script>
        const APK_URL='https://jefmth2.netlify.app/apk/Folgas107.apk';document.getElementById('download').addEventListener('click',()=>{const a=document.createElement('a');a.href=APK_URL;a.download='Folgas107.apk';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();const status=document.getElementById('status');status.replaceChildren('Se o download não iniciar, ');const link=document.createElement('a');link.href=APK_URL;link.download='Folgas107.apk';link.textContent='toque aqui';status.append(link,'.');});
    </script>
</body>

</html>
