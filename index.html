<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folgas107 – Atualizar</title>
<style>
:root {
  --bg: #008B8B;
  --bg-2: #006b6b;
  --ink: #ffffff;
  --accent: #ffd166;
  --dark: #04302f;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0);
  background: radial-gradient(120% 120% at 50% 0%, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  text-align: center;
}
main { width: min(100%, 360px); display: grid; gap: 28px; justify-items: center; }
#logo { max-width: 160px; height: auto; display: block; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; }
p.sub { margin: 6px 0 0; opacity: .85; font-size: .95rem; }

@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

.btn {
  appearance: none; cursor: pointer; width: 100%;
  font: inherit; font-weight: 700; font-size: 1.1rem; color: #fff;
  padding: 16px 24px; border-radius: 16px; position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
  isolation: isolate;
  border: 3px solid transparent;
  background-image:
    linear-gradient(var(--dark), var(--dark)),
    conic-gradient(from var(--ang), #ffd166, #06d6a0, #4cc9f0, #ffd166);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  animation: girar 3s linear infinite;
  transition: transform .15s ease;
}
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn:active { transform: scale(.97); }
.btn svg { width: 22px; height: 22px; flex: none; animation: girar-icone 2.2s cubic-bezier(.6,0,.3,1) infinite; }
@keyframes girar { to { --ang: 360deg; } }
@keyframes girar-icone { to { transform: rotate(360deg); } }

#status { min-height: 1.4em; font-size: .95rem; }
#status a { color: var(--accent); font-weight: 700; }

@media (hover: hover) { .btn:hover { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) {
  .btn, .btn svg { animation: none !important; }
}
</style>
</head>
<body>
<main>
  <div>
    <h1>Nova versão disponível</h1>
    <p class="sub">Toque no botão para baixar o Folgas107.apk</p>
  </div>

  <button class="btn" type="button" id="atualizar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
    Atualizar
  </button>

  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
const APK_URL = 'https://jefmth2.netlify.app/apk/Folgas107.apk';
const status = document.getElementById('status');

document.getElementById('atualizar').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = APK_URL;
  a.download = 'Folgas107.apk';
  a.rel = 'noopener';
  document.body.append(a);
  a.click();
  a.remove();
  status.innerHTML = 'Download iniciado. Se não começar, <a href="' + APK_URL + '" download="Folgas107.apk">toque aqui</a>.';
});
</script>
</body>
</html>
